name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these suites before publishing an image.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No job sets ANTHROPIC_API_KEY: every suite runs on the scripted LLM layer or a
# keyless API, so CI never makes a live model call.

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The memory extra (sqlite-vec, fastembed) un-skips the hybrid-retrieval tests.
      - run: uv sync --frozen --extra memory
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend:
    name: Frontend (svelte-check + vitest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  e2e:
    name: E2E (Playwright, desktop + phone)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # e2e/start-api.sh runs the API through `uv run`; FTS retrieval needs no extra.
      - run: uv sync --frozen
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
