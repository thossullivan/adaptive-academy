name: Bug report
description: Something doesn't work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please **don't paste API keys, `.env` contents, or your learning
        data** here. For a security problem, use a private advisory instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. Opened the Tutor on a concept
        2. Sent an attempt
        3. Expected the attempt to be logged; got "LLM request failed (502)"
    validations:
      required: true
  - type: dropdown
    id: run-mode
    attributes:
      label: How you run it
      options:
        - Docker / OrbStack (`just up`)
        - Local (`just dev`, or `just api` + `just frontend`)
        - Other
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: LLM backend
      options:
        - Anthropic API key (default)
        - Agent SDK (`AA_LLM_BACKEND=agent_sdk`)
        - No key (demo / browsing only)
    validations:
      required: true
  - type: input
    id: models
    attributes:
      label: Models
      description: The `models` shown by `curl -s localhost:8000/api/setup`, if you changed them.
      placeholder: "reasoning: claude-sonnet-5-5, copy: claude-haiku-5-5"
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `git rev-parse --short HEAD`, or the image tag.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The API log lines around the error (`just logs` for Docker). Remove anything private.
      render: shell
