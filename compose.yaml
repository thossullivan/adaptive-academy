services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    environment:
      AA_DATABASE_URL: sqlite:////data/adaptive_academy.db
      AA_EMBEDDING_CACHE_DIR: /data/fastembed_cache
      AA_OBSIDIAN_VAULT_PATH: /vault
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Optional model overrides from .env; blank falls back to the built-in default.
      AA_MODEL_REASONING: ${AA_MODEL_REASONING:-}
      AA_MODEL_COPY: ${AA_MODEL_COPY:-}
      # Optional daily spending limit (USD); blank = no limit. "Today" is the container's
      # day, which is UTC unless you also pass TZ.
      AA_DAILY_BUDGET_USD: ${AA_DAILY_BUDGET_USD:-}
    volumes:
      - aa-data:/data
      # Optional Obsidian vault. Unset OBSIDIAN_VAULT_PATH mounts an empty
      # ./data/vault so the stack starts without one. iCloud-synced vault: files
      # evicted by iCloud may read as empty until macOS re-materializes them.
      - "${OBSIDIAN_VAULT_PATH:-./data/vault}:/vault"

volumes:
  aa-data:
    name: adaptive-academy-data
